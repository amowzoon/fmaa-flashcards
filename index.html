  .stat b{font-size:20px}
  .list{font-size:12px}
  .list td.f{max-width:140px}
  .keys{display:none}
}
</style>
</head>
<body>
<div id="app">
<header>
  <button id="menuBtn" title="Sections & filters">☰</button>
  <h1>FMAA · Sections A &amp; B</h1>
  <div class="tabs">
    <div class="tab active" data-mode="flash">Flashcards</div>
    <div class="tab" data-mode="learn">Learn</div>
    <div class="tab" data-mode="write">Write</div>
    <div class="tab" data-mode="test">Test</div>
    <div class="tab" data-mode="exam">Exam</div>
    <div class="tab" data-mode="visual">Visual</div>
    <div class="tab" data-mode="browse">Browse</div>
    <div class="tab" data-mode="stats">Progress</div>
  </div>
  <div class="spacer"></div>
  <button id="btnReset" title="Clear all saved progress">Reset progress</button>
</header>
<main>
  <aside class="side">
    <div id="visNav"></div>
    <h3 class="notvis">Sections</h3>
    <div id="secList" class="notvis"></div>
    <div class="notvis" style="display:flex;gap:6px;margin-top:6px"><button id="selAll" style="flex:1;padding:4px">All</button><button id="selNone" style="flex:1;padding:4px">None</button></div>
    <h3 class="notvis">Filter</h3>
    <label class="notvis"><span>Show</span><select id="filter"><option value="all">all cards</option><option value="core">exam core only</option><option value="unlearned">not yet known</option><option value="starred">starred</option><option value="missed">missed in Learn</option><option value="due">due for review</option></select></label>
    <h3 class="notvis">Mastery</h3>
    <div class="bar notvis"><i id="masteryBar" style="width:0"></i></div>
    <div id="masteryTxt" class="cnt notvis"></div>
    <button id="btnResetM" style="display:none">Reset progress</button>
    <h3 class="keys">Keys</h3>
    <div class="keys" style="color:var(--muted);line-height:1.8">
      <span class="kbd">Space</span> flip · <span class="kbd">→</span> next · <span class="kbd">←</span> prev<br>
      <span class="kbd">1</span> still learning · <span class="kbd">2</span> know it<br>
      <span class="kbd">A</span>–<span class="kbd">D</span> pick choice · <span class="kbd">Enter</span> continue<br>
      <span class="kbd">S</span> star · <span class="kbd">R</span> shuffle
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <section class="content" id="content"></section>
</main>
</div>
<script src="deck.js?v=9"></script>
<script src="statements.js?v=1"></script>
<script src="visual.js?v=18"></script>
<script>
(function(){
const SECS={A1:"A.1 Terminology & Definitions",A2:"A.2 Recording Transactions",A3:"A.3 Financial Statements",A4:"A.4 Internal Controls",A5:"A.5 Daily Finances",B1:"B.1 Recognition & Valuation",B2:"B.2 Basic FS Analysis",B3:"B.3 Ratio Analysis",AB:"Abbreviations"};
const CARDS=window.FMAA_CARDS.map((c,i)=>({id:i,sec:c[0],front:c[1],back:c[2]}));
const MCQ=window.FMAA_MCQ.map((q,i)=>({id:i,sec:q[0],q:q[1],choices:q[2],ans:q[3],why:q[4]}));
const LS="fmaa_fc_v1";
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.cards){s.secs=s.secs.filter(x=>x!=='PQ');return s;}}catch(e){}return {cards:{},secs:Object.keys(SECS),mode:"flash",filter:"all",test:{done:0,right:0}};}
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function cs(id){return state.cards[id]||(state.cards[id]={lvl:0,seen:0,miss:0,star:0,due:0});}
// lvl: 0 new, 1 learning, 2 known (needs 2 consecutive correct in Learn), star flag

const content=document.getElementById("content");
const $=s=>document.querySelector(s);
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pool(){return CARDS.filter(c=>state.secs.includes(c.sec)).filter(c=>{const s=cs(c.id);switch(state.filter){case"core":return window.FMAA_CORE.has(c.id);case"unlearned":return s.lvl<2;case"starred":return !!s.star;case"missed":return s.miss>0;case"due":return s.lvl>=2&&s.due&&s.due<=Date.now();default:return true;}});}
function mcqPool(){return MCQ.filter(q=>state.secs.includes(q.sec));}

// ---------- sidebar ----------
function renderSide(){
  const el=document.getElementById("secList");
  el.innerHTML=Object.keys(SECS).map(k=>{const n=CARDS.filter(c=>c.sec===k).length;const known=CARDS.filter(c=>c.sec===k&&cs(c.id).lvl>=2).length;
    return `<label><span><input type="checkbox" data-sec="${k}" ${state.secs.includes(k)?"checked":""}> ${SECS[k]}</span><span class="cnt">${known}/${n}</span></label>`;}).join("");
  el.querySelectorAll("input").forEach(i=>i.onchange=()=>{const k=i.dataset.sec;state.secs=i.checked?[...new Set([...state.secs,k])]:state.secs.filter(x=>x!==k);save();rebuild();});
  const tot=CARDS.length,kn=CARDS.filter(c=>cs(c.id).lvl>=2).length;
  $("#masteryBar").style.width=(100*kn/tot)+"%";const due=CARDS.filter(c=>{const s=cs(c.id);return s.lvl>=2&&s.due&&s.due<=Date.now();}).length;$("#masteryTxt").textContent=`${kn} / ${tot} cards known${due?" · "+due+" due for review":""}`;
  $("#filter").value=state.filter;
}
$("#filter").onchange=e=>{state.filter=e.target.value;save();rebuild();};
$("#selAll").onclick=()=>{state.secs=Object.keys(SECS);save();rebuild();};
$("#selNone").onclick=()=>{state.secs=[];save();rebuild();};
const side=document.querySelector(".side"),bd=$("#backdrop");
const closeSide=()=>{side.classList.remove("open");bd.classList.remove("show");};window.closeSide=closeSide;
$("#menuBtn").onclick=()=>{side.classList.toggle("open");bd.classList.toggle("show");};
bd.onclick=closeSide;
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",closeSide));
$("#btnResetM").onclick=()=>$("#btnReset").click();
$("#btnReset").onclick=()=>{if(confirm("Clear all saved progress?")){state={cards:{},secs:Object.keys(SECS),mode:state.mode,filter:"all",test:{done:0,right:0}};save();rebuild();}};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{state.mode=t.dataset.mode;save();rebuild();});

// ---------- FLASHCARDS ----------
let fc={order:[],i:0,back:false};
function initFlash(){fc.order=shuffle(pool().map(c=>c.id));fc.i=0;fc.back=false;}
function renderFlash(){
  if(!fc.order.length||fc.order.some(id=>!pool().find(c=>c.id===id))){initFlash();}
  if(!fc.order.length){content.innerHTML=`<div class="stage"><div class="empty">No cards match the current sections/filter.</div></div>`;return;}
  const c=CARDS[fc.order[fc.i]],s=cs(c.id);
  content.innerHTML=`<div class="stage">
    <div class="card ${fc.back?"back":""}" id="card"><div class="lbl">${fc.back?"Answer":"Prompt"}</div><div class="sec">${SECS[c.sec]} ${s.star?"★":""} <span class="pill ${["n","l","k"][s.lvl]}">${["new","learning","known"][s.lvl]}</span></div><div class="txt">${esc(fc.back?c.back:c.front)}</div></div>
    <div class="controls">
      <button id="prev">← Prev</button>
      <button class="bad" id="learning">1 · Still learning</button>
      <button class="good" id="know">2 · Know it</button>
      <button id="next">Next →</button>
      <button id="star">${s.star?"★ Unstar":"☆ Star"}</button>
      <button id="shuf">Shuffle</button>
    </div>
    <div class="meta">${fc.i+1} / ${fc.order.length} · tap card to flip · swipe ←→</div>
  </div>`;
  $("#card").onclick=()=>{fc.back=!fc.back;renderFlash();};
  (function(){let x0=null,t0=0;const el=$("#card");el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;t0=Date.now();},{passive:true});
    el.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60&&Date.now()-t0<600){e.preventDefault();if(dx<0)$("#next").click();else $("#prev").click();}},{passive:false});})();
  $("#prev").onclick=()=>{fc.i=(fc.i-1+fc.order.length)%fc.order.length;fc.back=false;renderFlash();};
  $("#next").onclick=()=>{fc.i=(fc.i+1)%fc.order.length;fc.back=false;renderFlash();};
  $("#know").onclick=()=>{s.lvl=2;s.seen++;save();$("#next").onclick();renderSide();};
  $("#learning").onclick=()=>{s.lvl=Math.min(s.lvl,1);if(s.lvl===0)s.lvl=1;s.seen++;save();$("#next").onclick();renderSide();};
  $("#star").onclick=()=>{s.star=s.star?0:1;save();renderFlash();};
  $("#shuf").onclick=()=>{initFlash();renderFlash();};
}

// ---------- LEARN (adaptive multiple choice, Quizlet-style) ----------
let ln={queue:[],cur:null,answered:false,streak:{},round:0,stats:{right:0,wrong:0}};
function buildLearnQueue(){
  const now=Date.now();
  const p=pool().filter(c=>{const s=cs(c.id);return s.lvl<2||(s.due&&s.due<=now);});
  // due reviews first (spaced repetition), then previously missed, then new, then learning; shuffled so sections interleave
  const w=c=>{const s=cs(c.id);return (s.lvl>=2&&s.due<=now?0:s.miss>0?1:s.lvl===0?2:3)+Math.random()*0.9;};
  ln.queue=p.sort((a,b)=>w(a)-w(b)).map(c=>c.id).slice(0,20);
  ln.round++;
}
function nextLearn(){
  if(!ln.queue.length){buildLearnQueue();if(!ln.queue.length){ln.cur=null;renderLearn();return;}}
  const id=ln.queue.shift();const c=CARDS[id];
  const numeric=t=>/\$\s?\d|\d{2,}/.test(t);const kind=numeric(c.back);
  let pool_=CARDS.filter(o=>o.id!==id&&numeric(o.back)===kind&&o.back!==c.back);
  let others=shuffle(pool_.filter(o=>o.sec===c.sec)).slice(0,3);
  if(others.length<3)others=others.concat(shuffle(pool_.filter(o=>!others.includes(o)&&o.sec!==c.sec)).slice(0,3-others.length));
  const choices=shuffle([{t:c.back,ok:true},...others.map(o=>({t:o.back,ok:false}))]);
  ln.cur={card:c,choices,picked:null};ln.answered=false;renderLearn();
}
function renderLearn(){
  if(!ln.cur){
    const remaining=pool().filter(c=>{const s=cs(c.id);return s.lvl<2||(s.due&&s.due<=Date.now());}).length;
    content.innerHTML=`<div class="stage"><div class="stats">
      <div class="stat"><b>${remaining}</b><span>cards left to master in selection</span></div>
      <div class="stat"><b>${ln.stats.right}</b><span>correct this session</span></div>
      <div class="stat"><b>${ln.stats.wrong}</b><span>missed this session</span></div></div>
      <div class="controls" style="margin-top:20px">${remaining?`<button class="primary" id="startLearn">Start round</button>`:`<div class="empty">Everything in this selection is marked known. Change sections/filter or reset.</div>`}</div>
      <div class="meta">A card becomes "known" after 2 correct answers in a row, then comes back for review after 1, 3, 7, 14 and 30 days (spaced repetition). Misses reset it. Sections are interleaved.</div></div>`;
    const b=$("#startLearn");if(b)b.onclick=()=>{buildLearnQueue();nextLearn();};return;
  }
  const {card:c,choices}=ln.cur,s=cs(c.id);
  content.innerHTML=`<div class="stage" style="justify-content:flex-start;padding-top:10px">
    <div class="q"><div class="sec">${SECS[c.sec]} · <span class="pill ${["n","l","k"][s.lvl]}">${["new","learning","known"][s.lvl]}</span> · streak ${ln.streak[c.id]||0}/2</div>${esc(c.front)}</div>
    <div class="choices">${choices.map((ch,i)=>`<div class="choice" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(ch.t)}</span></div>`).join("")}</div>
    <div id="fb"></div>
    <div class="controls" id="lc"><button id="dontknow">Don't know</button></div>
    <div class="meta">queue: ${ln.queue.length} left · session ${ln.stats.right}✓ ${ln.stats.wrong}✗</div>
  </div>`;
  content.querySelectorAll(".choice").forEach(el=>el.onclick=()=>answerLearn(+el.dataset.i));
  $("#dontknow").onclick=()=>answerLearn(-1);
}
function answerLearn(i){
  if(ln.answered)return;ln.answered=true;
  const {card:c,choices}=ln.cur,s=cs(c.id);const ok=i>=0&&choices[i].ok;s.seen++;
  content.querySelectorAll(".choice").forEach((el,j)=>{if(choices[j].ok)el.classList.add("correct");else if(j===i)el.classList.add("wrong");else el.classList.add("dim");});
  const DAY=864e5,IV=[1,3,7,14,30];
  if(ok){ln.stats.right++;ln.streak[c.id]=(ln.streak[c.id]||0)+1;if(ln.streak[c.id]>=2){s.lvl=2;s.iv=IV[Math.min(IV.indexOf(s.iv||0)+1,IV.length-1)]||1;if(!IV.includes(s.iv))s.iv=1;s.due=Date.now()+s.iv*DAY;}else{s.lvl=Math.max(s.lvl,1);ln.queue.splice(Math.min(4,ln.queue.length),0,c.id);}}
  else{ln.stats.wrong++;ln.streak[c.id]=0;s.miss++;s.lvl=1;s.iv=0;s.due=Date.now();ln.queue.splice(Math.min(2,ln.queue.length),0,c.id);}
  save();renderSide();
  $("#fb").innerHTML=`<div class="explain" style="border-color:${ok?"var(--good)":"var(--bad)"}">${ok?"Correct.":"Answer:"} ${ok?"":esc(c.back)}</div>`;
  $("#lc").innerHTML=`<button class="primary" id="cont">Continue (Enter)</button><button id="star">${s.star?"★ Unstar":"☆ Star"}</button>`;
  $("#cont").onclick=nextLearn;$("#star").onclick=()=>{s.star=s.star?0:1;save();$("#star").textContent=s.star?"★ Unstar":"☆ Star";};
}

// ---------- WRITE (typed recall, self-graded) ----------
let wr={order:[],i:0,revealed:false};
function renderWrite(){
  if(!wr.order.length||wr.order.some(id=>!pool().find(c=>c.id===id))){wr.order=shuffle(pool().map(c=>c.id));wr.i=0;wr.revealed=false;}
  if(!wr.order.length){content.innerHTML=`<div class="stage"><div class="empty">No cards match.</div></div>`;return;}
  const c=CARDS[wr.order[wr.i]],s=cs(c.id);
  content.innerHTML=`<div class="stage" style="justify-content:flex-start;padding-top:10px">
    <div class="q"><div class="sec">${SECS[c.sec]}</div>${esc(c.front)}</div>
    <textarea id="ans" placeholder="Type your answer, then press Ctrl+Enter or Reveal…" ${wr.revealed?"disabled":""}></textarea>
    ${wr.revealed?`<div class="explain" style="border-color:var(--accent)"><b>Model answer</b>\n${esc(c.back)}</div>`:""}
    <div class="controls" id="wc">${wr.revealed?`<button class="bad" id="w1">1 · Missed it</button><button class="good" id="w2">2 · Got it</button>`:`<button class="primary" id="reveal">Reveal</button>`}<button id="skip">Skip →</button></div>
    <div class="meta">${wr.i+1} / ${wr.order.length}</div></div>`;
  const ta=$("#ans");if(!wr.revealed){ta.focus();ta.onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){wr.revealed=true;renderWrite();}};}
  const adv=()=>{wr.i=(wr.i+1)%wr.order.length;wr.revealed=false;renderWrite();};
  if($("#reveal"))$("#reveal").onclick=()=>{wr.revealed=true;renderWrite();};
  if($("#w1"))$("#w1").onclick=()=>{s.miss++;s.lvl=1;s.seen++;save();renderSide();adv();};
  if($("#w2"))$("#w2").onclick=()=>{s.lvl=2;s.seen++;save();renderSide();adv();};
  $("#skip").onclick=adv;
}

// ---------- TEST (PRC quiz MCQs) ----------
let ts={qs:[],i:0,picked:[],done:false};
function startTest(){ts.qs=shuffle(mcqPool().slice());ts.i=0;ts.picked=[];ts.done=false;renderTest();}
function renderTest(){
  if(!ts.qs.length){content.innerHTML=`<div class="stage"><div class="stats"><div class="stat"><b>${mcqPool().length}</b><span>quiz questions in selected sections</span></div><div class="stat"><b>${state.test.done?Math.round(100*state.test.right/state.test.done)+"%":"—"}</b><span>lifetime accuracy (${state.test.right}/${state.test.done})</span></div></div><div class="controls" style="margin-top:20px"><button class="primary" id="st">Start test</button></div><div class="meta">PRC session quiz items (QUC) plus the exam-style practice questions, spread across their topic sections, all with explanations. For endless computation questions with fresh numbers, use Visual → Drills.</div></div>`;$("#st").onclick=startTest;return;}
  if(ts.done){const r=ts.picked.filter((p,i)=>p===ts.qs[i].ans).length;
    content.innerHTML=`<div class="stage" style="justify-content:flex-start"><div class="stats"><div class="stat"><b>${r}/${ts.qs.length}</b><span>score · ${Math.round(100*r/ts.qs.length)}%</span></div></div>
    <div class="list" style="margin-top:14px"><table><tr><th>#</th><th>Sec</th><th>Question</th><th>You</th><th>Ans</th></tr>${ts.qs.map((q,i)=>`<tr style="color:${ts.picked[i]===q.ans?"var(--good)":"var(--bad)"}"><td>${i+1}</td><td>${q.sec}</td><td>${esc(q.q)}<div style="color:var(--muted);font-size:12px">${esc(q.why)}</div></td><td>${ts.picked[i]>=0?"ABCD"[ts.picked[i]]:"—"}</td><td>${"ABCD"[q.ans]}</td></tr>`).join("")}</table></div>
    <div class="controls"><button class="primary" id="again">New test</button></div></div>`;$("#again").onclick=startTest;return;}
  const q=ts.qs[ts.i],p=ts.picked[ts.i];
  content.innerHTML=`<div class="stage" style="justify-content:flex-start;padding-top:10px">
    <div class="q"><div class="sec">${SECS[q.sec]} · Q ${ts.i+1}/${ts.qs.length}</div>${esc(q.q)}</div>
    <div class="choices">${q.choices.map((c,i)=>`<div class="choice ${p!==undefined?(i===q.ans?"correct":i===p?"wrong":"dim"):""}" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(c)}</span></div>`).join("")}</div>
    ${p!==undefined?`<div class="explain">${esc(q.why)}</div>`:""}
    <div class="controls">${p!==undefined?`<button class="primary" id="tn">${ts.i+1<ts.qs.length?"Next (Enter)":"Finish (Enter)"}</button>`:""}</div></div>`;
  if(p===undefined)content.querySelectorAll(".choice").forEach(el=>el.onclick=()=>{ts.picked[ts.i]=+el.dataset.i;state.test.done++;if(+el.dataset.i===q.ans)state.test.right++;save();renderTest();});
  else $("#tn").onclick=()=>{if(ts.i+1<ts.qs.length){ts.i++;}else{ts.done=true;}renderTest();};
}

// ---------- BROWSE ----------
function renderBrowse(){
  const p=pool();
  content.innerHTML=`<div class="stage" style="justify-content:flex-start"><div class="list"><table><tr><th>Sec</th><th>Front</th><th>Back</th><th>Status</th><th></th></tr>${p.map(c=>{const s=cs(c.id);return `<tr><td>${c.sec}</td><td>${esc(c.front)}</td><td style="color:var(--muted)">${esc(c.back)}</td><td><span class="pill ${["n","l","k"][s.lvl]}">${["new","learning","known"][s.lvl]}</span>${s.miss?` <span class="pill l">${s.miss}✗</span>`:""}</td><td><button data-id="${c.id}" style="padding:2px 8px">${s.star?"★":"☆"}</button></td></tr>`;}).join("")}</table></div><div class="meta">${p.length} cards</div></div>`;
  content.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{const s=cs(+b.dataset.id);s.star=s.star?0:1;save();renderBrowse();});
}

// ---------- STATS ----------
function renderStats(){
  const rows=Object.keys(SECS).map(k=>{const cs_=CARDS.filter(c=>c.sec===k);const kn=cs_.filter(c=>cs(c.id).lvl>=2).length,lr=cs_.filter(c=>cs(c.id).lvl===1).length,ms=cs_.reduce((a,c)=>a+cs(c.id).miss,0);return {k,n:cs_.length,kn,lr,ms};});
  const worst=CARDS.filter(c=>cs(c.id).miss>0).sort((a,b)=>cs(b.id).miss-cs(a.id).miss).slice(0,10);
  content.innerHTML=`<div class="stage" style="justify-content:flex-start">
    <div class="stats">${rows.map(r=>`<div class="stat"><b>${Math.round(100*r.kn/r.n)}%</b><span>${SECS[r.k]}<br>${r.kn} known · ${r.lr} learning · ${r.n-r.kn-r.lr} new · ${r.ms} misses</span><div class="bar" style="margin-top:6px"><i style="width:${100*r.kn/r.n}%"></i></div></div>`).join("")}</div>
    <div class="list" style="margin-top:16px"><table><tr><th colspan="3">Most missed</th></tr>${worst.length?worst.map(c=>`<tr><td>${c.sec}</td><td>${esc(c.front)}</td><td style="color:var(--bad)">${cs(c.id).miss}✗</td></tr>`).join(""):`<tr><td class="empty">No misses recorded yet.</td></tr>`}</table></div>
    <div class="meta">Test accuracy: ${state.test.done?Math.round(100*state.test.right/state.test.done)+"% ("+state.test.right+"/"+state.test.done+")":"—"}</div></div>`;
}


function rebuild(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.mode===state.mode));
  document.body.classList.toggle("mode-visual",state.mode==="visual"||state.mode==="exam");
  renderSide();
  ({flash:renderFlash,learn:renderLearn,write:renderWrite,test:renderTest,visual:()=>window.renderVisual({content,state,save},"visual"),exam:()=>window.renderVisual({content,state,save},"exam"),browse:renderBrowse,stats:renderStats})[state.mode]();
}
// keyboard
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  const m=state.mode,k=e.key;if(m==="visual"||m==="exam")return;
  if(m==="flash"){if(k===" "){e.preventDefault();$("#card")&&$("#card").click();}else if(k==="ArrowRight")$("#next")&&$("#next").click();else if(k==="ArrowLeft")$("#prev")&&$("#prev").click();else if(k==="1")$("#learning")&&$("#learning").click();else if(k==="2")$("#know")&&$("#know").click();else if(k.toLowerCase()==="s")$("#star")&&$("#star").click();else if(k.toLowerCase()==="r")$("#shuf")&&$("#shuf").click();}
  else if(m==="learn"||m==="test"){const idx="abcd".indexOf(k.toLowerCase());if(idx>=0){const el=content.querySelectorAll(".choice")[idx];if(el&&!el.classList.contains("correct")&&!el.classList.contains("wrong")&&!el.classList.contains("dim"))el.click();}
    else if(k==="Enter"){const b=$("#cont")||$("#tn")||$("#startLearn")||$("#st")||$("#again");b&&b.click();}else if(k.toLowerCase()==="s"){$("#star")&&$("#star").click();}}
  else if(m==="write"){if(k==="1")$("#w1")&&$("#w1").click();else if(k==="2")$("#w2")&&$("#w2").click();else if(k==="ArrowRight")$("#skip")&&$("#skip").click();}
});
rebuild();
})();
</script>
